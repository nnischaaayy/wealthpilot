name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://wealthpilot:wealthpilot@localhost:5432/wealthpilot
  REDIS_URL: redis://localhost:6379

jobs:
  web:
    name: web (lint, typecheck, test, integration, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealthpilot
          POSTGRES_PASSWORD: wealthpilot
          POSTGRES_DB: wealthpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        working-directory: packages/db
        run: npx prisma generate
      - name: Apply migrations
        working-directory: packages/db
        run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build
      # architecture.md §14 dependency hygiene — advisory only (npm audit's
      # exit code would fail the build on any new transitive advisory,
      # including ones with no fix yet available; Dependabot, configured
      # separately, is what actually drives fixes).
      - name: Dependency audit (advisory)
        run: npm audit --omit=dev || true

  # architecture.md §15: e2e + a11y scan runs less often than the fast PR
  # gate (lint/typecheck/unit/integration/build above) — here, on merge to
  # main rather than a true nightly cron, since there's no scheduled-run
  # infra to exercise that in this environment.
  e2e:
    name: e2e + accessibility (Playwright + axe-core)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealthpilot
          POSTGRES_PASSWORD: wealthpilot
          POSTGRES_DB: wealthpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: e2e-ci-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        working-directory: packages/db
        run: npx prisma generate
      - name: Apply migrations
        working-directory: packages/db
        run: npx prisma migrate deploy
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps
      - name: Write apps/web/.env.local for the dev server
        working-directory: apps/web
        run: |
          echo "DATABASE_URL=$DATABASE_URL" >> .env.local
          echo "AUTH_SECRET=$AUTH_SECRET" >> .env.local
      - name: Run e2e + accessibility tests
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  ai-service:
    name: ai-service (lint, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealthpilot
          POSTGRES_PASSWORD: wealthpilot
          POSTGRES_DB: wealthpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # get_transactions (tools/transactions.py) reads the same schema Prisma
      # owns — migrations are applied below before pytest runs.
      DATABASE_URL_AI: postgresql://wealthpilot:wealthpilot@localhost:5432/wealthpilot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client and apply migrations
        working-directory: packages/db
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements-dev.txt
      - name: Install ai-service dependencies
        working-directory: apps/ai-service
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: apps/ai-service
        run: ruff check .
      - name: Test
        working-directory: apps/ai-service
        run: pytest -q
      - name: Dependency audit (advisory)
        working-directory: apps/ai-service
        run: pip-audit || true
