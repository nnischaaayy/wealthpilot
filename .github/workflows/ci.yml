name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://wealthpilot:wealthpilot@localhost:5432/wealthpilot

jobs:
  web:
    name: web (lint, typecheck, test, integration, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealthpilot
          POSTGRES_PASSWORD: wealthpilot
          POSTGRES_DB: wealthpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        working-directory: packages/db
        run: npx prisma generate
      - name: Apply migrations
        working-directory: packages/db
        run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build

  ai-service:
    name: ai-service (lint, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealthpilot
          POSTGRES_PASSWORD: wealthpilot
          POSTGRES_DB: wealthpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # get_transactions (tools/transactions.py) reads the same schema Prisma
      # owns — migrations are applied below before pytest runs.
      DATABASE_URL_AI: postgresql://wealthpilot:wealthpilot@localhost:5432/wealthpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client and apply migrations
        working-directory: packages/db
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements-dev.txt
      - name: Install ai-service dependencies
        working-directory: apps/ai-service
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: apps/ai-service
        run: ruff check .
      - name: Test
        working-directory: apps/ai-service
        run: pytest -q
