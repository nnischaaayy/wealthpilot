# Fly.io deploy config (architecture.md §16) — a long-lived container for
# SSE streaming + background ingestion, unlike serverless apps/web.
# Deploy with: fly launch --config fly.toml / fly deploy
# Requires (fly secrets set ...): ANTHROPIC_API_KEY, VOYAGE_API_KEY,
# DATABASE_URL_AI, REDIS_URL — all optional/gracefully-degrading per their
# respective phase except DATABASE_URL_AI.
app = "wealthpilot-ai-service"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
